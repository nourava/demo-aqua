<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b1329" />
    <meta name="description" content="AquaGuard - Simple, offline-capable drinking water contamination logging, GIS hazard alerts, and community water safety." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <title>AquaGuard - Household Water Safety & Community Alerts</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="./leaflet/leaflet.css" />

    <!-- Application Styles -->
    <script type="module" crossorigin src="./assets/index-BxVikWcA.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CF2yIOnP.css">
  </head>
  <body>
    <div id="app"></div>

    <script>
      // Clear any stale caches on dev/reload
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.update();
          }
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
